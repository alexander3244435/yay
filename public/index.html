<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Primary Button Example</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f6f7fb;
      }
      main {
        text-align: center;
        padding: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        color: #111827;
      }
      p {
        margin: 0 0 24px;
        color: #4b5563;
      }
      .primary-button {
        appearance: none;
        border: none;
        background: #2563eb;
        color: #fff;
        padding: 14px 28px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }
      .primary-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.28);
        background: #1d4ed8;
      }
      .primary-button:active {
        transform: translateY(0);
        box-shadow: 0 6px 14px rgba(37, 99, 235, 0.2);
      }
      .primary-button:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.35);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Primary Action Button</h1>
      <p>The button below is centered and styled with hover and focus states.</p>
      <button class="primary-button" type="button" id="primary-button">button</button>
    </main>
    <script>
      const button = document.getElementById("primary-button");
      button.addEventListener("click", () => {
        window.alert("Button clicked!");
      });
    </script>
  </body>
</html>
